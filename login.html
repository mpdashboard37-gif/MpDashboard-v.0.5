<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MP Dashboard - Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400;500&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --ink: #17152b;
            --muted: #89879a;
            --line: #e7e6ee;
            --purple: #7163ed;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            overflow: auto;
            color: var(--ink);
            font-family: 'Manrope', sans-serif;
            background: #f1f3ff;
        }

        body::before {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at 8% 8%, rgba(190, 214, 255, .4), transparent 32%), radial-gradient(circle at 92% 92%, rgba(225, 207, 255, .42), transparent 35%);
            content: '';
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
        }

        .login-shell {
            display: grid;
            width: min(1120px, calc(100vw - 48px));
            min-height: 660px;
            margin: max(24px, calc((100vh - 660px) / 2)) auto;
            overflow: hidden;
            grid-template-columns: 45% 55%;
            border-radius: 23px;
            background: #fff;
            box-shadow: 0 25px 70px rgba(73, 79, 145, .19), 0 5px 18px rgba(73, 79, 145, .07);
            animation: card-in .55s ease-out both;
        }

        .login-visual {
            position: relative;
            display: flex;
            min-height: 660px;
            padding: 34px 38px;
            overflow: hidden;
            color: #fff;
            background: linear-gradient(145deg, #7fe2f2 0%, #5b8eed 30%, #413bc4 57%, #7562e3 77%, #c1a7ee 100%);
        }

        .login-visual::before,
        .login-visual::after {
            position: absolute;
            border-radius: 50%;
            content: '';
            pointer-events: none;
        }

        .login-visual::before {
            top: -180px;
            right: -130px;
            width: 460px;
            height: 460px;
            background: radial-gradient(circle, rgba(255, 255, 255, .18), transparent 68%);
            filter: blur(8px);
        }

        .login-visual::after {
            bottom: -170px;
            left: 10%;
            width: 420px;
            height: 340px;
            background: rgba(200, 174, 255, .23);
            filter: blur(55px);
        }

        .visual-content {
            position: relative;
            z-index: 1;
            display: flex;
            width: 100%;
            flex-direction: column;
        }

        .visual-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-lockup {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            text-decoration: none;
        }

        .brand-mark {
            display: grid;
            width: 29px;
            height: 29px;
            place-items: center;
            border: 2px solid rgba(255, 255, 255, .9);
            border-radius: 9px 4px 9px 4px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: -.08em;
        }

        .brand-name {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .08em;
        }

        .visual-nav-links {
            display: flex;
            gap: 18px;
        }

        .visual-nav-links a {
            color: rgba(255, 255, 255, .76);
            font-size: 11px;
            text-decoration: none;
        }

        .visual-copy {
            margin-top: auto;
            max-width: 390px;
            padding-bottom: 15px;
        }

        .visual-kicker {
            margin: 0 0 11px;
            color: rgba(255, 255, 255, .75);
            font-size: 14px;
            font-weight: 500;
        }

        .visual-copy h2 {
            margin: 0;
            color: #fff;
            font-size: clamp(30px, 3.25vw, 42px);
            font-weight: 800;
            line-height: 1.13;
            letter-spacing: -.045em;
            min-height: 4.52em;
        }

        .typing-cursor {
            display: inline-block;
            width: .04em;
            height: .94em;
            margin-left: .12em;
            vertical-align: -.08em;
            background: currentColor;
            animation: typing-cursor-blink .85s ease-in-out infinite;
        }

        .typing-cursor.is-hidden {
            visibility: hidden;
        }

        .login-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 52px 76px 42px;
            background: #fff;
        }

        .eyebrow {
            margin-bottom: 20px;
            color: var(--purple);
            font-size: 22px;
            line-height: 1;
        }

        .login-panel h1 {
            margin: 0;
            color: var(--ink);
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -.045em;
        }

        .subcopy {
            max-width: 430px;
            margin: 11px 0 29px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.65;
            min-height: 3.3em;
        }

        .login-form {
            display: grid;
            gap: 17px;
        }

        .field-group label {
            display: block;
            margin-bottom: 8px;
            color: #444258;
            font-size: 12px;
            font-weight: 700;
        }

        .input-wrap {
            position: relative;
        }

        .material-symbols-outlined {
            font-size: 20px;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
        }

        .field-icon {
            position: absolute;
            top: 50%;
            left: 15px;
            color: #aaa8b8;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .login-panel input[type='text'],
        .login-panel input[type='password'] {
            width: 100%;
            height: 52px;
            padding: 0 45px;
            border: 1px solid var(--line);
            border-radius: 9px;
            outline: 0;
            color: var(--ink);
            background: #fff;
            font-size: 13px;
            transition: border-color .2s, box-shadow .2s;
        }

        .login-panel input::placeholder {
            color: #b5b3c0;
        }

        .login-panel input:focus {
            border-color: #8c80f1;
            box-shadow: 0 0 0 4px rgba(113, 99, 237, .11);
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 13px;
            display: grid;
            padding: 4px;
            color: #aaa8b8;
            background: transparent;
            cursor: pointer;
            transform: translateY(-50%);
        }

        .toggle-password:hover {
            color: var(--purple);
        }

        .field-error {
            min-height: 0;
            margin-top: 5px;
            color: #c34457;
            font-size: 11px;
        }

        .account-tools {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: -3px;
            color: #9896a6;
            font-size: 11px;
        }

        .remember-label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
        }

        .remember-label input {
            accent-color: var(--purple);
        }

        .login-link,
        #forgotPassword {
            padding: 0;
            color: var(--purple);
            background: transparent;
            text-decoration: none;
            cursor: pointer;
        }

        .login-link:hover,
        #forgotPassword:hover {
            color: #5144cf;
            text-decoration: underline;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            color: #9997a6;
            font-size: 10px;
            line-height: 1.45;
        }

        .terms input {
            flex: 0 0 auto;
            margin: 1px 0 0;
            accent-color: var(--purple);
        }

        .terms a {
            color: var(--purple);
        }

        .login-button {
            height: 51px;
            border-radius: 9px;
            color: #fff;
            background: linear-gradient(100deg, #5266ee, #7860e9);
            box-shadow: 0 12px 22px rgba(103, 88, 224, .25);
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s, filter .2s;
        }

        .login-button:hover:not(:disabled) {
            box-shadow: 0 15px 27px rgba(103, 88, 224, .34);
            filter: saturate(1.12);
            transform: translateY(-1px);
        }

        .login-button:disabled,
        .google-button:disabled,
        .social-button:disabled {
            cursor: not-allowed;
            opacity: .58;
        }

        .login-button.is-loading {
            cursor: wait;
        }

        .login-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 23px 0 15px;
            color: #aaa8b5;
            font-size: 10px;
        }

        .login-divider::before,
        .login-divider::after {
            height: 1px;
            flex: 1;
            background: #e8e7ed;
            content: '';
        }

        .social-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .social-button {
            display: grid;
            height: 45px;
            place-items: center;
            border-radius: 8px;
            color: #5d5b6c;
            background: #f4f4f7;
            font-size: 17px;
            font-weight: 800;
            transition: background .2s, transform .2s;
        }

        .social-button:hover:not(:disabled) {
            background: #eae9f1;
            transform: translateY(-1px);
        }

        .behance {
            font-size: 13px;
            letter-spacing: -.08em;
        }

        .facebook {
            font-family: Arial, sans-serif;
            font-size: 21px;
        }

        .google {
            color: #4285f4;
            font-family: Arial, sans-serif;
        }

        .security-alert {
            margin-top: 12px;
            border: 1px solid #f3cbd2;
            border-radius: 8px;
            color: #a23c4c;
            background: #fff3f4;
            font-size: 11px;
            line-height: 1.5;
        }

        .login-message {
            margin-top: 12px;
            font-size: 11px;
        }

        .signup {
            margin: 25px 0 0;
            color: #9694a2;
            text-align: center;
            font-size: 11px;
        }

        .contact-admin-button {
            margin-top: 7px;
            color: #a23c4c;
            background: transparent;
            font-size: 11px;
            text-decoration: underline;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .login-spinner {
            display: inline-block;
            width: 13px;
            height: 13px;
            margin-right: 7px;
            border: 2px solid rgba(255, 255, 255, .45);
            border-top-color: #fff;
            border-radius: 50%;
            vertical-align: -2px;
            animation: spin .7s linear infinite;
        }

        @keyframes card-in {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes typing-cursor-blink {

            0%,
            45% {
                opacity: 1;
            }

            46%,
            100% {
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .typing-cursor {
                animation: none;
            }
        }

        @media (max-width: 820px) {
            .login-shell {
                width: min(620px, calc(100vw - 28px));
                margin: 14px auto;
                grid-template-columns: 1fr;
            }

            .login-visual {
                min-height: 245px;
                padding: 27px 30px;
            }

            .visual-copy {
                padding-bottom: 0;
            }

            .visual-copy h2 {
                font-size: 32px;
            }

            .login-panel {
                padding: 42px clamp(28px, 8vw, 70px) 38px;
            }
        }

        @media (max-width: 430px) {
            .login-shell {
                width: calc(100vw - 20px);
                border-radius: 18px;
            }

            .visual-nav-links {
                display: none;
            }

            .login-visual {
                min-height: 215px;
                padding: 24px;
            }

            .visual-copy h2 {
                font-size: 28px;
            }

            .login-panel {
                padding: 35px 23px 30px;
            }

            .login-panel h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>
    <main class="login-shell">
        <section class="login-visual" aria-label="MP Dashboard">
            <div class="visual-content">
                <nav class="visual-nav" aria-label="Login navigation">
                    <a class="brand-lockup" href="login.html"><span class="brand-mark" aria-hidden="true">MP</span><span
                            class="brand-name">MP DASHBOARD</span></a>
                    <div class="visual-nav-links"><a href="sign-up.html">Sign Up</a><a href="sign-up.html">Join Us</a>
                    </div>
                </nav>
                <div class="visual-copy">
                    <p class="visual-kicker">You can easily</p>
                    <h2 aria-live="polite"><span id="visualTypingText">Get access your personal hub for clarity and
                            productivity</span><span class="typing-cursor is-hidden" aria-hidden="true"></span></h2>
                </div>
            </div>
        </section>
        <section class="login-panel">
            <div class="eyebrow" aria-hidden="true">✦</div>
            <h1>Create an account</h1>
            <p class="subcopy" aria-live="polite"><span id="subcopyTypingText">Access your tasks, notes, and projects
                    anytime, anywhere - and keep everything flowing in one place.</span><span
                    class="typing-cursor is-hidden" aria-hidden="true"></span></p>
            <form id="loginForm" class="login-form" novalidate>
                <div class="field-group"><label for="loginId">Your email</label>
                    <div class="input-wrap"><span class="material-symbols-outlined field-icon"
                            aria-hidden="true">mail</span><input id="loginId" type="text" autocomplete="username"
                            placeholder="Enter your email address" required /></div>
                    <div id="emailError" class="field-error" role="alert"></div>
                </div>
                <div class="field-group"><label for="password">Password</label>
                    <div class="input-wrap"><span class="material-symbols-outlined field-icon"
                            aria-hidden="true">lock</span><input id="password" type="password"
                            autocomplete="current-password" placeholder="Enter your password" required /><button
                            id="togglePassword" class="toggle-password" type="button" aria-label="Show password"><span
                                class="material-symbols-outlined" aria-hidden="true">visibility</span></button></div>
                    <div id="passwordError" class="field-error" role="alert"></div>
                </div>
                <div class="account-tools"><label class="remember-label"><input id="rememberMe" type="checkbox" />
                        Remember me</label><button id="forgotPassword" type="button">Forgot password?</button></div>
                <label class="terms"><input id="termsCheck" type="checkbox" /><span>I agree to the <a href="#">Terms of
                            Service</a> &amp; <a href="#">Privacy Policy</a>.</span></label>
                <button id="loginButton" class="login-button" type="submit" disabled><span id="loginButtonText">Get
                        Started</span></button>
                <div id="loginMessage" class="login-message hidden" role="alert"></div>
            </form>
            <div class="login-divider"><span>or continue with</span></div>
            <div class="social-row" aria-label="Social sign in options"><button class="social-button behance"
                    type="button" disabled aria-label="Behance sign in unavailable">Bē</button><button id="googleLogin"
                    class="social-button google" type="button" disabled
                    aria-label="Continue with Google">G</button><button class="social-button facebook" type="button"
                    disabled aria-label="Facebook sign in unavailable">f</button></div>
            <p class="signup">Don't have an account? <a id="signUpLink" class="login-link" href="sign-up.html">Sign
                    up</a></p>
        </section>
    </main>
    <script>
        const CURRENT_USER_KEY = 'solarflow_crm_current_user';
        const TOKEN_KEY = 'solarflow_crm_api_token';
        const loginForm = document.getElementById('loginForm');
        const loginIdInput = document.getElementById('loginId');
        const passwordInput = document.getElementById('password');
        const rememberMe = document.getElementById('rememberMe');
        const loginButton = document.getElementById('loginButton');
        const loginButtonText = document.getElementById('loginButtonText');
        const messageBox = document.getElementById('loginMessage');
        const termsCheck = document.getElementById('termsCheck');
        const googleBtn = document.getElementById('googleLogin');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const REMEMBERED_EMAIL_KEY = 'rememberedEmail';
        const rememberedEmail = localStorage.getItem(REMEMBERED_EMAIL_KEY);
        if (rememberedEmail) { loginIdInput.value = rememberedEmail; rememberMe.checked = true; }
        termsCheck.addEventListener('change', (e) => { const isAccepted = e.target.checked; loginButton.disabled = !isAccepted; if (googleBtn) googleBtn.disabled = !isAccepted; });
        function showMessage(message, success = false, title = '') {
            messageBox.className = success ? 'login-message' : 'security-alert'; messageBox.textContent = title ? `${title}: ${message}` : message;
            if (title === 'Account Deactivated') { const contactButton = document.createElement('button'); contactButton.type = 'button'; contactButton.className = 'contact-admin-button'; contactButton.textContent = 'Contact Admin'; contactButton.addEventListener('click', () => { window.location.href = 'mailto:admin@mpdashboard.com?subject=CRM%20account%20reactivation'; }); messageBox.appendChild(document.createElement('br')); messageBox.appendChild(contactButton); }
        }
        function clearMessage() { messageBox.className = 'login-message hidden'; messageBox.textContent = ''; }
        function validateCredentials() { const loginId = loginIdInput.value.trim(); const password = passwordInput.value; const validLoginId = loginId.length > 0 && !(/[\s]/.test(loginId)); emailError.textContent = validLoginId ? '' : 'Please enter your username or email address.'; passwordError.textContent = password.length >= 6 ? '' : 'Password must be at least 6 characters.'; return validLoginId && password.length >= 6; }
        loginIdInput.addEventListener('input', () => { emailError.textContent = ''; });
        passwordInput.addEventListener('input', () => { passwordError.textContent = ''; });

        function typeLoop(element, text, cursor, options = {}) {
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reduceMotion) {
                element.textContent = text;
                cursor.classList.add('is-hidden');
                return;
            }

            let characterIndex = 0;
            let deleting = false;

            function step() {
                if (!deleting) {
                    characterIndex += 1;
                    element.textContent = text.slice(0, characterIndex);
                    cursor.classList.toggle('is-hidden', characterIndex === 0);
                    if (characterIndex === text.length) {
                        deleting = true;
                        return window.setTimeout(step, options.completePause);
                    }
                    return window.setTimeout(step, options.typeSpeed());
                }

                characterIndex -= 1;
                element.textContent = text.slice(0, characterIndex);
                cursor.classList.toggle('is-hidden', characterIndex === 0);
                if (characterIndex === 0) {
                    deleting = false;
                    return window.setTimeout(step, options.deletePause);
                }
                return window.setTimeout(step, options.deleteSpeed());
            }

            element.textContent = '';
            cursor.classList.add('is-hidden');
            step();
        }

        typeLoop(
            document.getElementById('visualTypingText'),
            'Get access your personal hub for clarity and productivity',
            document.querySelector('.visual-copy .typing-cursor'),
            { typeSpeed: () => 90, deleteSpeed: () => 55, completePause: 2000, deletePause: 700 }
        );
        typeLoop(
            document.getElementById('subcopyTypingText'),
            'Access your tasks, notes, and projects anytime, anywhere - and keep everything flowing in one place.',
            document.querySelector('.subcopy .typing-cursor'),
            { typeSpeed: () => 90, deleteSpeed: () => 55, completePause: 2000, deletePause: 700 }
        );

        async function loginStaff(loginId, password) {
            try {
                const response = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ loginId, password, rememberMe: rememberMe.checked }) });
                const result = await response.json().catch(() => ({}));
                if (!response.ok) {
                    const title = response.status === 423 ? 'Account Locked' : result.title;
                    const message = response.status === 401 ? 'Invalid email or password.' : response.status === 403 ? (result.error || 'Your account is not authorized.') : response.status === 423 ? (result.error || 'Your account has been temporarily locked.') : response.status >= 500 ? 'CRM server error. Please try again later.' : (result.error || 'Unable to complete login. Please try again.');
                    return { success: false, title, message };
                }
                localStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(TOKEN_KEY); (rememberMe.checked ? localStorage : sessionStorage).setItem(TOKEN_KEY, result.token); localStorage.removeItem(CURRENT_USER_KEY); sessionStorage.removeItem(CURRENT_USER_KEY); (rememberMe.checked ? localStorage : sessionStorage).setItem(CURRENT_USER_KEY, JSON.stringify(result.user)); localStorage.setItem('solarflow_crm_remember', rememberMe.checked ? 'true' : 'false'); if (rememberMe.checked) localStorage.setItem(REMEMBERED_EMAIL_KEY, loginId); else localStorage.removeItem(REMEMBERED_EMAIL_KEY); return { success: true };
            } catch (error) { return { success: false, message: 'Unable to connect to the CRM server. Please try again.' }; }
        }
        document.getElementById('togglePassword').addEventListener('click', function () { const visible = passwordInput.type === 'text'; passwordInput.type = visible ? 'password' : 'text'; this.setAttribute('aria-label', visible ? 'Show password' : 'Hide password'); this.querySelector('span').textContent = visible ? 'visibility' : 'visibility_off'; });
        document.getElementById('forgotPassword').addEventListener('click', async () => { const loginId = loginIdInput.value.trim().toLowerCase(); if (!loginId || /\s/.test(loginId)) return showMessage('Please enter your username or email address.'); try { const response = await fetch('/api/auth/forgot-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ loginId }) }); const result = await response.json(); showMessage(result.message, true); } catch (error) { showMessage('Unable to connect. Please try again.'); } });
        document.querySelectorAll('a[href="#"]').forEach((link) => link.addEventListener('click', (event) => { event.preventDefault(); showMessage(`${link.textContent.trim()} is not available yet. Please contact your administrator.`); }));
        async function initializeGoogleLogin() {
            const params = new URLSearchParams(window.location.search); const authToken = params.get('authToken'); const authError = params.get('authError');
            if (authToken) { localStorage.setItem(TOKEN_KEY, authToken); try { const response = await fetch('/api/auth/me', { headers: { Authorization: `Bearer ${authToken}` } }); const result = await response.json(); if (!response.ok) throw new Error('Session could not be created.'); localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(result.user)); window.history.replaceState({}, document.title, window.location.pathname); window.location.href = 'index.html'; return; } catch (error) { localStorage.removeItem(TOKEN_KEY); showMessage('Unable to complete Google sign-in. Please try again.'); } }
            if (authError) { showMessage(authError); window.history.replaceState({}, document.title, window.location.pathname); }
            try { const response = await fetch('/api/auth/google/config'); const config = await response.json(); if (!config.configured) googleBtn.title = 'Google Sign-In is being configured'; googleBtn.addEventListener('click', async () => { clearMessage(); if (!config.configured) return showMessage('Google Sign-In is not configured by the CRM administrator yet.'); googleBtn.disabled = true; googleBtn.classList.add('is-loading'); googleBtn.textContent = '...'; window.location.href = '/api/auth/google/start'; }); } catch (error) { googleBtn.addEventListener('click', () => showMessage('Unable to connect to the authentication service.')); }
        }
        initializeGoogleLogin();
        loginForm.addEventListener('submit', async (event) => { event.preventDefault(); if (loginButton.disabled) return; clearMessage(); const loginId = loginIdInput.value.trim().toLowerCase(); const password = passwordInput.value; if (!validateCredentials()) return; loginButton.disabled = true; loginButton.classList.add('is-loading'); loginButtonText.innerHTML = '<span class="login-spinner" aria-hidden="true"></span>Signing In...'; const result = await loginStaff(loginId, password); loginButton.classList.remove('is-loading'); if (!result.success) { passwordInput.value = ''; loginIdInput.focus(); loginButton.disabled = false; loginButtonText.textContent = 'Get Started'; return showMessage(result.message, false, result.title); } showMessage('Login successful. Redirecting...', true); window.setTimeout(() => { window.location.href = 'index.html'; }, 400); });
    </script>
