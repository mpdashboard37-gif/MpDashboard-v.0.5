<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Management - MP DASHBOARD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="crm-api.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400;FILL@0;GRAD@0;opsz@24&display=swap"
        rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .material-symbols-outlined {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-family: 'Material Symbols Outlined', 'Segoe UI Symbol', sans-serif;
            font-size: inherit;
            line-height: 1;
            vertical-align: middle;
            font-style: normal;
            font-weight: 400;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <button id="backToDashboardBtn"
                    class="inline-flex items-center gap-2 px-3 py-2 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-sm font-medium text-slate-700">
                    <span class="material-symbols-outlined text-base">arrow_back</span>
                    Back
                </button>
                <div>
                    <p class="text-sm uppercase tracking-wide text-slate-500">Owner/Admin</p>
                    <h1 class="text-3xl font-bold text-slate-900">Staff Management</h1>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="text-right">
                    <p id="currentUserName" class="font-semibold text-slate-800">Admin</p>
                    <p id="currentUserRole" class="text-sm text-slate-500">Admin/Owner</p>
                </div>
                <button id="logoutBtn"
                    class="px-3 py-2 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-sm font-medium">Logout</button>
            </div>
        </div>

        <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
            <div class="flex items-center justify-between border-b border-slate-200 p-4">
                <h2 class="text-xl font-semibold text-slate-800">Employees <span id="pendingCount"
                        class="text-sm font-medium text-amber-600"></span></h2>
                <button id="openAddStaffModal"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg">+ Add
                    Staff</button>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200">
                    <thead class="bg-slate-50">
                        <tr>
                            <th
                                class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                                Name</th>
                            <th
                                class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                                Employee ID</th>
                            <th
                                class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                                Department</th>
                            <th
                                class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                                Designation</th>
                            <th
                                class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                                Login ID</th>
                            <th
                                class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                                Status</th>
                            <th
                                class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                                Failed Attempts</th>
                            <th
                                class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                                Deactivated At</th>
                            <th
                                class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                                Actions</th>
                        </tr>
                    </thead>
                    <tbody id="staffTableBody" class="divide-y divide-slate-200 bg-white"></tbody>
                </table>
            </div>
        </div>
    </div>

    <section class="mt-6 bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
        <div class="flex items-center justify-between border-b border-slate-200 p-4">
            <h2 class="text-xl font-semibold text-slate-800">CRM Access Requests <span id="accessRequestCount"
                    class="ml-2 rounded-full bg-amber-100 px-2 py-1 text-sm font-semibold text-amber-700">0</span></h2>
            <button id="refreshAccessRequests"
                class="px-3 py-2 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-sm font-medium">Refresh</button>
        </div>
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-slate-200">
                <thead class="bg-slate-50">
                    <tr>
                        <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                            Request ID</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                            Applicant</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                            Email / Phone</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                            Request Date</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                            Status</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                            Actions</th>
                    </tr>
                </thead>
                <tbody id="accessRequestTableBody" class="divide-y divide-slate-200 bg-white">
                    <tr>
                        <td colspan="6" class="px-4 py-6 text-center text-sm text-slate-500">Loading access requests...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <div id="staffModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between p-4 border-b border-slate-200">
                <h3 id="staffModalTitle" class="text-xl font-semibold text-slate-800">Add Staff</h3>
                <button id="closeStaffModal" class="text-slate-500 hover:text-slate-700">✕</button>
            </div>

            <form id="staffForm" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Employee Name</label>
                    <input id="name" aria-label="Employee Name" type="text"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none"
                        required />
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Employee ID</label>
                    <input id="employeeId" aria-label="Employee ID" type="text"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none"
                        required />
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Department</label>
                    <select id="department" aria-label="Department"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none"
                        required>
                        <option value="Sales">Sales</option>
                        <option value="Telecalling">Telecalling</option>
                        <option value="Installation">Installation</option>
                        <option value="Administration">Administration</option>
                        <option value="Operations">Operations</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Designation</label>
                    <select id="designation" aria-label="Designation"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none"
                        required>
                        <option value="Sales Executive">Sales Executive</option>
                        <option value="Telecaller">Telecaller</option>
                        <option value="Installation Team">Installation Team</option>
                        <option value="Admin/Owner">Admin/Owner</option>
                        <option value="Manager">Manager</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Login ID</label>
                    <input id="loginId" aria-label="Login ID" type="text"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none"
                        required />
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Status</label>
                    <select id="status" aria-label="Status"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none"
                        required>
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input id="password" aria-label="Password" type="password"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none"
                        required />
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Confirm Password</label>
                    <input id="confirmPassword" aria-label="Confirm Password" type="password"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none"
                        required />
                </div>

                <input id="editingId" type="hidden" />

                <div class="md:col-span-2 flex justify-end gap-3 pt-2">
                    <button type="button" id="cancelStaffBtn"
                        class="px-4 py-2.5 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-50">Cancel</button>
                    <button type="submit"
                        class="px-4 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium">Create
                        Staff</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const CURRENT_USER_KEY = 'solarflow_crm_current_user';
        let staffCache = [];

        function getCurrentUser() {
            return JSON.parse(localStorage.getItem(CURRENT_USER_KEY) || 'null');
        }

        function ensureAccess() {
            const currentUser = getCurrentUser() || JSON.parse(sessionStorage.getItem(CURRENT_USER_KEY) || 'null');
            if (!currentUser || currentUser.role !== 'Admin/Owner' || !window.crmApi?.token()) {
                window.location.href = 'login.html';
            }
            document.getElementById('currentUserName').textContent = currentUser?.name || 'Admin';
            document.getElementById('currentUserRole').textContent = currentUser?.role || 'Admin/Owner';
        }

        function getStaffList() {
            return staffCache;
        }

        function saveStaffList(staff) {
            staffCache = staff.map(({ password, ...employee }) => employee);
        }

        function renderStaffTable() {
            const staff = getStaffList();
            const tbody = document.getElementById('staffTableBody');
            tbody.innerHTML = '';
            const pendingCount = staff.filter((employee) => employee.accountStatus === 'PENDING').length;
            document.getElementById('pendingCount').textContent = pendingCount ? `(${pendingCount} pending)` : '';

            staff.forEach((employee) => {
                const protectedAdmin = employee.id === 'staff-admin' || String(employee.loginId || '').toLowerCase() === 'admin';
                const row = document.createElement('tr');
                row.className = 'hover:bg-slate-50';
                row.innerHTML = `
          <td class="px-4 py-3 font-medium text-slate-800">${employee.name}</td>
          <td class="px-4 py-3 text-slate-600">${employee.employeeId}</td>
          <td class="px-4 py-3 text-slate-600">${employee.department}</td>
          <td class="px-4 py-3 text-slate-600">${employee.designation}</td>
          <td class="px-4 py-3 text-slate-600">${employee.loginId}</td>
                    <td class="px-4 py-3">
                        <span class="px-2 py-1 rounded-full text-xs font-semibold ${employee.accountStatus === 'ACTIVE' || employee.status === 'Active' ? 'bg-green-100 text-green-700' : employee.accountStatus === 'PENDING' ? 'bg-amber-100 text-amber-700' : 'bg-red-100 text-red-700'}">${employee.accountStatus === 'DEACTIVATED' ? 'Deactivated' : employee.accountStatus === 'DECLINED' ? 'Declined' : employee.accountStatus === 'PENDING' ? 'Pending Approval' : employee.status}</span>
          </td>
                    <td class="px-4 py-3 text-slate-600">${Number(employee.failedLoginAttempts || 0)}/5</td>
                    <td class="px-4 py-3 text-slate-600">${employee.deactivatedAt ? new Date(employee.deactivatedAt).toLocaleString() : '-'}</td>
          <td class="px-4 py-3">
            <div class="flex flex-wrap gap-2 text-sm">
              <button class="view-btn px-2 py-1 rounded border border-slate-200 hover:bg-slate-100" data-id="${employee.id}">View</button>
              ${protectedAdmin ? '<span class="px-2 py-1 text-slate-500">Protected Admin</span>' : `<button class="edit-btn px-2 py-1 rounded border border-slate-200 hover:bg-slate-100" data-id="${employee.id}">Edit</button>
              <button class="reset-btn px-2 py-1 rounded border border-slate-200 hover:bg-slate-100" data-id="${employee.id}">Reset Password</button>
              <button class="toggle-btn px-2 py-1 rounded border border-slate-200 hover:bg-slate-100" data-id="${employee.id}">${employee.accountStatus === 'PENDING' ? 'Approve / Decline' : employee.accountStatus === 'DEACTIVATED' || employee.accountStatus === 'DECLINED' || employee.status !== 'Active' ? 'Reactivate Account' : 'Deactivate Account'}</button>
              <button class="delete-btn px-2 py-1 rounded border border-red-200 text-red-600 hover:bg-red-50" data-id="${employee.id}">Delete</button>`}
            </div>
          </td>
        `;
                tbody.appendChild(row);
            });

            document.querySelectorAll('.view-btn').forEach((button) => {
                button.addEventListener('click', () => {
                    const employee = staff.find((item) => item.id === button.dataset.id);
                    if (!employee) return;
                    alert(`Employee Name: ${employee.name}\nEmployee ID: ${employee.employeeId}\nDepartment: ${employee.department}\nDesignation: ${employee.designation}\nLogin ID: ${employee.loginId}\nStatus: ${employee.status}`);
                });
            });

            document.querySelectorAll('.edit-btn').forEach((button) => {
                button.addEventListener('click', () => {
                    const employee = staff.find((item) => item.id === button.dataset.id);
                    if (!employee) return;
                    openStaffModal(employee);
                });
            });

            document.querySelectorAll('.reset-btn').forEach((button) => {
                button.addEventListener('click', () => {
                    const employee = staff.find((item) => item.id === button.dataset.id);
                    if (!employee) return;
                    const newPassword = prompt(`Reset password for ${employee.name}. Enter new password:`, '');
                    if (newPassword === null || newPassword.trim() === '') return;
                    crmApi.updateStaff(employee.id, { password: newPassword.trim() }).then(() => crmApi.getStaff()).then(({ staff: fresh }) => { saveStaffList(fresh); renderStaffTable(); alert('Password reset successfully.'); }).catch((error) => alert(error.message));
                });
            });

            document.querySelectorAll('.toggle-btn').forEach((button) => {
                button.addEventListener('click', () => {
                    const employee = staff.find((item) => item.id === button.dataset.id);
                    if (!employee) return;
                    const isPending = employee.accountStatus === 'PENDING';
                    const isDeactivated = employee.accountStatus === 'DEACTIVATED' || employee.accountStatus === 'DECLINED' || employee.status !== 'Active';
                    const action = isPending ? prompt(`Type APPROVE or DECLINE for ${employee.name}'s account:`)?.trim().toUpperCase() : isDeactivated ? 'REACTIVATE' : 'DEACTIVATE';
                    if (!action || !['APPROVE', 'DECLINE', 'REACTIVATE', 'DEACTIVATE'].includes(action)) return alert('No account action was performed.');
                    if (!isPending && !confirm(`Are you sure you want to ${action.toLowerCase()} ${employee.name}'s account?`)) return;
                    const accountStatus = action === 'APPROVE' || action === 'REACTIVATE' ? 'ACTIVE' : action === 'DECLINE' ? 'DECLINED' : 'DEACTIVATED';
                    crmApi.updateStaff(employee.id, { accountStatus, reason: action === 'DECLINE' ? 'Declined by administrator' : action === 'DEACTIVATE' ? 'Deactivated by administrator' : undefined }).then(() => crmApi.getStaff()).then(({ staff: fresh }) => { saveStaffList(fresh); renderStaffTable(); }).catch((error) => alert(error.message));
                });
            });

            document.querySelectorAll('.delete-btn').forEach((button) => {
                button.addEventListener('click', () => {
                    const employee = staff.find((item) => item.id === button.dataset.id);
                    if (!employee) return;
                    if (confirm(`Delete ${employee.name}?`)) crmApi.deleteStaff(employee.id).then(() => crmApi.getStaff()).then(({ staff: fresh }) => { saveStaffList(fresh); renderStaffTable(); }).catch((error) => alert(error.message));
                });
            });
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
        }

        function renderAccessRequests(requests) {
            const tbody = document.getElementById('accessRequestTableBody');
            const pendingRequests = requests.filter((accessRequest) => accessRequest.status === 'Pending');
            document.getElementById('accessRequestCount').textContent = pendingRequests.length;
            if (!requests.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-6 text-center text-sm text-slate-500">No CRM access requests yet.</td></tr>';
                return;
            }
            tbody.innerHTML = requests.map((accessRequest) => {
                const details = accessRequest.details || {};
                const statusClass = accessRequest.status === 'Pending' ? 'bg-amber-100 text-amber-700' : accessRequest.status === 'Approved' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';
                const actions = accessRequest.status === 'Pending' ? `<button class="view-request-btn px-2 py-1 rounded border border-slate-200 hover:bg-slate-100" data-id="${escapeHtml(accessRequest.id)}">View</button><button class="approve-request-btn px-2 py-1 rounded bg-green-600 text-white hover:bg-green-700" data-id="${escapeHtml(accessRequest.id)}" data-name="${escapeHtml(accessRequest.full_name)}">Approve</button><button class="reject-request-btn px-2 py-1 rounded bg-red-600 text-white hover:bg-red-700" data-id="${escapeHtml(accessRequest.id)}" data-name="${escapeHtml(accessRequest.full_name)}">Reject</button>` : `<button class="view-request-btn px-2 py-1 rounded border border-slate-200 hover:bg-slate-100" data-id="${escapeHtml(accessRequest.id)}">View</button>`;
                return `<tr class="hover:bg-slate-50"><td class="px-4 py-3 text-xs font-mono text-slate-600">${escapeHtml(accessRequest.id)}</td><td class="px-4 py-3 font-medium text-slate-800">${escapeHtml(accessRequest.full_name)}</td><td class="px-4 py-3 text-slate-600">${escapeHtml(accessRequest.email)}<br /><span class="text-xs">${escapeHtml(accessRequest.phone || details.phone || 'Not provided')}</span></td><td class="px-4 py-3 text-slate-600">${escapeHtml(new Date(accessRequest.created_at).toLocaleString())}</td><td class="px-4 py-3"><span class="px-2 py-1 rounded-full text-xs font-semibold ${statusClass}">${escapeHtml(accessRequest.status)}</span></td><td class="px-4 py-3"><div class="flex flex-wrap gap-2 text-sm">${actions}</div></td></tr>`;
            }).join('');

            document.querySelectorAll('.view-request-btn').forEach((button) => button.addEventListener('click', async () => {
                try {
                    const { request } = await crmApi.getAccessRequest(button.dataset.id);
                    const details = request.details || {};
                    alert(`Request ID: ${request.id}\nFull Name: ${request.full_name}\nEmail: ${request.email}\nPhone: ${request.phone || details.phone || 'Not provided'}\nRequest Date: ${new Date(request.created_at).toLocaleString()}\nStatus: ${request.status}${request.rejection_reason ? `\nReason: ${request.rejection_reason}` : ''}`);
                } catch (error) { alert(error.message); }
            }));
            document.querySelectorAll('.approve-request-btn').forEach((button) => button.addEventListener('click', async () => {
                if (!confirm(`Approve CRM access for ${button.dataset.name}?`)) return;
                try { await crmApi.approveAccessRequest(button.dataset.id); await loadAccessRequests(); await refreshStaff(); alert('CRM access approved.'); } catch (error) { alert(error.message); }
            }));
            document.querySelectorAll('.reject-request-btn').forEach((button) => button.addEventListener('click', async () => {
                if (!confirm(`Reject CRM access request for ${button.dataset.name}?`)) return;
                const reason = prompt('Optional rejection reason:', '') || '';
                try { await crmApi.rejectAccessRequest(button.dataset.id, reason); await loadAccessRequests(); alert('CRM access request rejected.'); } catch (error) { alert(error.message); }
            }));
        }

        async function loadAccessRequests() {
            try { const { requests } = await crmApi.getAccessRequests(); renderAccessRequests(requests); } catch (error) { document.getElementById('accessRequestTableBody').innerHTML = `<tr><td colspan="6" class="px-4 py-6 text-center text-sm text-red-600">${escapeHtml(error.message)}</td></tr>`; }
        }

        async function refreshStaff() {
            const { staff } = await crmApi.getStaff(); saveStaffList(staff); renderStaffTable();
        }

        document.getElementById('refreshAccessRequests').addEventListener('click', loadAccessRequests);

        const modal = document.getElementById('staffModal');
        const form = document.getElementById('staffForm');
        const modalTitle = document.getElementById('staffModalTitle');

        function openStaffModal(employee = null) {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            form.reset();
            document.getElementById('editingId').value = employee ? employee.id : '';
            document.getElementById('staffModalTitle').textContent = employee ? 'Edit Staff' : 'Add Staff';
            document.querySelector('#staffForm button[type="submit"]').textContent = employee ? 'Update Staff' : 'Create Staff';

            if (employee) {
                document.getElementById('name').value = employee.name;
                document.getElementById('employeeId').value = employee.employeeId;
                document.getElementById('department').value = employee.department;
                document.getElementById('designation').value = employee.designation;
                document.getElementById('loginId').value = employee.loginId;
                document.getElementById('status').value = employee.status;
                document.getElementById('password').value = '';
                document.getElementById('confirmPassword').value = '';
                document.getElementById('password').required = false;
                document.getElementById('confirmPassword').required = false;
            } else {
                document.getElementById('password').required = true;
                document.getElementById('confirmPassword').required = true;
            }
        }

        function closeStaffModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            form.reset();
        }

        document.getElementById('openAddStaffModal').addEventListener('click', () => openStaffModal());
        document.getElementById('closeStaffModal').addEventListener('click', closeStaffModal);
        document.getElementById('cancelStaffBtn').addEventListener('click', closeStaffModal);

        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            const editingId = document.getElementById('editingId').value;
            const payload = {
                name: document.getElementById('name').value.trim(),
                employeeId: document.getElementById('employeeId').value.trim(),
                department: document.getElementById('department').value,
                designation: document.getElementById('designation').value,
                loginId: document.getElementById('loginId').value.trim(),
                status: document.getElementById('status').value,
                role: document.getElementById('designation').value === 'Admin/Owner' ? 'Admin/Owner' : (document.getElementById('designation').value === 'Sales Executive' ? 'Sales Executive' : (document.getElementById('designation').value === 'Telecaller' ? 'Telecaller' : (document.getElementById('designation').value === 'Installation Team' ? 'Installation Team' : 'Employee'))),
            };

            if (!payload.name || !payload.employeeId || !payload.loginId) {
                alert('Please fill all required fields.');
                return;
            }

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (!editingId && (!password || !confirmPassword)) {
                alert('Password and confirm password are required for a new employee.');
                return;
            }
            if (password && password !== confirmPassword) {
                alert('Passwords do not match.');
                return;
            }

            try {

                                </button>
                                <div>
                                    <p class="text-xs uppercase tracking-[0.18em] text-slate-500">Admin</p>
                                    <h1 class="text-3xl font-bold text-slate-900">Settings</h1>
                                </div>
                            </div>
                            <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
                                <div class="relative">
                                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">search</span>
                                    <input id="settingsSearch" type="search" placeholder="Search settings" class="w-full rounded-lg border border-slate-300 bg-white py-2.5 pl-10 pr-3 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100 sm:w-64" />
                                </div>
                                <div class="flex items-center gap-3">
                                    <div class="text-right">
                                        <p id="settingsUserName" class="font-semibold text-slate-800">Admin</p>
                                        <p id="settingsUserRole" class="text-sm text-slate-500">Admin/Owner</p>
                                    </div>
                                    <button id="settingsLogoutBtn" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Logout</button>
                                </div>
                            </div>
                        </div>

                        <div id="settingsToast" class="hidden fixed right-5 top-5 z-50 max-w-sm rounded-xl border border-slate-200 bg-white px-4 py-3 shadow-lg"></div>
                        <div id="settingsAccessWarning" class="hidden mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"></div>

                        <div class="grid grid-cols-1 gap-6 lg:grid-cols-4">
                            <aside class="lg:col-span-1">
                                <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
                                    <div class="border-b border-slate-200 bg-slate-50 px-4 py-3 font-semibold text-slate-700">Navigation</div>
                                    <nav id="settingsNav" class="space-y-1 p-2"></nav>
                                </div>
                            </aside>
                            <main id="settingsMain" class="space-y-6 lg:col-span-3"></main>
                        </div>
                    </div>

                    <div id="settingsModalBackdrop" class="fixed inset-0 z-40 hidden bg-slate-900/40"></div>
                    <div id="settingsModal" class="fixed left-1/2 top-1/2 z-50 hidden w-full max-w-lg -translate-x-1/2 -translate-y-1/2 rounded-2xl border border-slate-200 bg-white p-5 shadow-xl"></div>
                `;

                document.getElementById('settingsBackBtn').addEventListener('click', () => {
                    window.location.href = 'index.html';
                });

                document.getElementById('settingsLogoutBtn').addEventListener('click', async () => {
                    try { await crmApi.request('/api/auth/logout', { method: 'POST' }); } catch (error) { console.error(error); }
                    localStorage.removeItem('solarflow_crm_current_user');
                    sessionStorage.removeItem('solarflow_crm_current_user');
                    localStorage.removeItem('solarflow_crm_api_token');
                    sessionStorage.removeItem('solarflow_crm_api_token');
                    window.location.href = 'login.html';
                });

                document.getElementById('settingsSearch').addEventListener('input', (event) => {
                    const term = String(event.target.value || '').trim().toLowerCase();
                    const navButtons = document.querySelectorAll('#settingsNav button[data-target]');
                    navButtons.forEach((button) => {
                        const item = button.dataset.label || '';
                        const match = !term || item.toLowerCase().includes(term);
                        button.classList.toggle('hidden', !match);
                    });
                    const sections = document.querySelectorAll('.settings-section');
                    sections.forEach((section) => {
                        const sectionName = section.dataset.title || '';
                        section.classList.toggle('hidden', !!term && !sectionName.toLowerCase().includes(term));
                    });
                });
            }

            function showToast(message, type = 'success') {
                const toast = document.getElementById('settingsToast');
                if (!toast) return;
                toast.textContent = message;
                toast.className = `fixed right-5 top-5 z-50 max-w-sm rounded-xl border px-4 py-3 shadow-lg ${type === 'error' ? 'border-red-200 bg-red-50 text-red-700' : 'border-emerald-200 bg-emerald-50 text-emerald-700'}`;
                toast.classList.remove('hidden');
                clearTimeout(showToast.timeoutId);
                showToast.timeoutId = setTimeout(() => toast.classList.add('hidden'), 3000);
            }

            function setActiveSection(id) {
                state.activeId = id;
                const navButtons = document.querySelectorAll('#settingsNav button[data-target]');
                navButtons.forEach((button) => {
                    const active = button.dataset.target === id;
                    button.classList.toggle('bg-blue-50', active);
                    button.classList.toggle('text-blue-700', active);
                    button.classList.toggle('font-semibold', active);
                    button.classList.toggle('text-slate-600', !active);
                });
                document.querySelectorAll('.settings-section').forEach((section) => {
                    section.classList.toggle('hidden', section.id !== `section-${id}`);
                });
            }

            function renderFormField(field, settings) {
                const value = deepGet(settings, field.key);
                const common = 'w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm text-slate-800 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100';
                if (field.type === 'checkbox') {
                    return `
                        <label class="flex items-center justify-between gap-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-3">
                            <span class="text-sm font-medium text-slate-700">${field.label}</span>
                            <input data-field="${field.key}" type="checkbox" ${value ? 'checked' : ''} class="h-5 w-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500" />
                        </label>
                    `;
                }
                if (field.type === 'select') {
                    const options = (field.options || []).map((option) => `<option value="${option}" ${String(value ?? '') === String(option) ? 'selected' : ''}>${option}</option>`).join('');
                    return `
                        <label class="block">
                            <span class="mb-1 block text-sm font-medium text-slate-700">${field.label}</span>
                            <select data-field="${field.key}" class="${common}">${options}</select>
                        </label>
                    `;
                }
                if (field.type === 'textarea') {
                    return `
                        <label class="block md:col-span-2">
                            <span class="mb-1 block text-sm font-medium text-slate-700">${field.label}</span>
                            <textarea data-field="${field.key}" rows="3" class="${common}">${value ?? ''}</textarea>
                        </label>
                    `;
                }
                if (field.type === 'color') {
                    return `
                        <label class="block">
                            <span class="mb-1 block text-sm font-medium text-slate-700">${field.label}</span>
                            <input data-field="${field.key}" type="color" value="${value || '#2563eb'}" class="h-11 w-full rounded-lg border border-slate-300 bg-white px-2 py-1.5" />
                        </label>
                    `;
                }
                const inputType = field.type === 'password' ? 'password' : field.type === 'email' ? 'email' : field.type === 'tel' ? 'tel' : field.type === 'number' ? 'number' : 'text';
                return `
                    <label class="block">
                        <span class="mb-1 block text-sm font-medium text-slate-700">${field.label}</span>
                        <input data-field="${field.key}" type="${inputType}" value="${value ?? ''}" class="${common}" />
                    </label>
                `;
            }

            function renderTableSection(section) {
                const rows = (section.rows || []).map((row) => `
                    <tr class="border-t border-slate-200">
                        ${row.map((cell, index) => `<td class="px-3 py-3 text-sm text-slate-700 ${index === row.length - 1 ? 'w-32' : ''}">${cell}</td>`).join('')}
                    </tr>
                `).join('');
                return `
                    <section id="section-${section.id}" data-title="${section.label}" class="settings-section hidden rounded-2xl border border-slate-200 bg-white shadow-sm p-5">
                        <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                            <div>
                                <h2 class="text-xl font-semibold text-slate-900">${section.label}</h2>
                                <p class="text-sm text-slate-500">${section.description}</p>
                            </div>
                            <button type="button" class="inline-flex items-center gap-2 rounded-lg bg-blue-600 px-3 py-2 text-sm font-medium text-white hover:bg-blue-700">
                                <span class="material-symbols-outlined text-base">add</span> ${section.addAction || 'Add New'}
                            </button>
                        </div>
                        <div class="overflow-x-auto rounded-xl border border-slate-200">
                            <table class="min-w-full divide-y divide-slate-200 text-left">
                                <thead class="bg-slate-50">
                                    <tr>
                                        ${section.columns.map((column) => `<th class="px-3 py-3 text-xs font-semibold uppercase tracking-wide text-slate-500">${column}</th>`).join('')}
                                    </tr>
                                </thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>
                    </section>
                `;
            }

            function renderFormSection(section) {
                const fieldsHtml = section.fields.map((field) => renderFormField(field, state.settings)).join('');
                return `
                    <section id="section-${section.id}" data-title="${section.label}" class="settings-section hidden rounded-2xl border border-slate-200 bg-white shadow-sm p-5">
                        <div class="mb-5 flex items-center justify-between gap-3">
                            <div>
                                <h2 class="text-xl font-semibold text-slate-900">${section.label}</h2>
                                <p class="text-sm text-slate-500">${section.description}</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</button>
                                <button type="button" data-save-section="${section.id}" class="rounded-lg bg-blue-600 px-3 py-2 text-sm font-medium text-white hover:bg-blue-700">Save</button>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 gap-5 md:grid-cols-2">${fieldsHtml}</div>
                    </section>
                `;
            }

            function renderMain() {
                const html = settingsCatalog.map((section) => section.type === 'table' ? renderTableSection(section) : renderFormSection(section)).join('');
                const main = document.getElementById('settingsMain');
                main.innerHTML = html;
                const nav = document.getElementById('settingsNav');
                nav.innerHTML = settingsCatalog.map((section) => `
                    <button data-target="${section.id}" data-label="${section.label}" type="button" class="flex w-full items-center gap-2 rounded-lg px-3 py-2.5 text-left text-sm text-slate-600 hover:bg-slate-100 ${section.id === state.activeId ? 'bg-blue-50 text-blue-700 font-semibold' : ''}">
                        <span class="material-symbols-outlined text-base">${section.icon}</span>
                        <span>${section.label}</span>
                    </button>
                `).join('');
                nav.querySelectorAll('button[data-target]').forEach((button) => {
                    button.addEventListener('click', () => setActiveSection(button.dataset.target));
                });
                document.querySelectorAll('[data-save-section]').forEach((button) => {
                    button.addEventListener('click', async () => {
                        const sectionId = button.dataset.saveSection;
                        await saveSettingsSection(sectionId);
                    });
                });
                setActiveSection(state.activeId);
            }

            function saveSettingsSection(sectionId) {
                const section = settingsCatalog.find((item) => item.id === sectionId);
                if (!section) return;
                const payload = {};
                section.fields.forEach((field) => {
                    const element = document.querySelector(`[data-field="${field.key}"]`);
                    if (!element) return;
                    const value = element.type === 'checkbox' ? element.checked : element.value;
                    if (field.type === 'password' && !value) return;
                    deepSet(payload, field.key, value);
                });
                state.settings = { ...state.settings, ...payload };
                const fullPayload = { ...state.settings };
                const button = document.querySelector(`[data-save-section="${sectionId}"]`);
                if (button) {
                    button.disabled = true;
                    button.textContent = 'Saving...';
                }
                crmApi.request('/api/settings', { method: 'PATCH', body: JSON.stringify(fullPayload) })
                    .then(() => {
                        showToast(`${section.label} saved successfully.`);
                    })
                    .catch((error) => {
                        showToast(error.message || 'Unable to save settings.', 'error');
                    })
                    .finally(() => {
                        if (button) {
                            button.disabled = false;
                            button.textContent = 'Save';
                        }
                    });
            }

            function applyFormValues() {
                settingsCatalog.forEach((section) => {
                    if (section.type !== 'form') return;
                    section.fields.forEach((field) => {
                        const element = document.querySelector(`[data-field="${field.key}"]`);
                        if (!element) return;
                        const value = deepGet(state.settings, field.key);
                        if (field.type === 'password') {
                            element.value = '';
                            element.placeholder = value ? 'Configured; leave blank to keep current' : '';
                        } else if (element.type === 'checkbox') element.checked = Boolean(value);
                        else if (element.type === 'color') element.value = value || '#2563eb';
                        else element.value = value ?? '';
                    });
                });
            }

            async function loadSettingsData() {
                try {
                    const response = await crmApi.request('/api/settings');
                    const saved = response.settings || {};
                    state.settings = deepMerge(state.settings, saved);
                    applyFormValues();
                } catch (error) {
                    const warning = document.getElementById('settingsAccessWarning');
                    warning.textContent = error.message || 'Unable to load settings.';
                    warning.classList.remove('hidden');
                }
            }

            function deepMerge(base, incoming) {
                if (!base || typeof base !== 'object') return incoming || {};
                const merged = Array.isArray(base) ? [...base] : { ...base };
                Object.entries(incoming || {}).forEach(([key, value]) => {
                    if (value !== null && typeof value === 'object' && !Array.isArray(value) && merged[key] && typeof merged[key] === 'object' && !Array.isArray(merged[key])) {
                        merged[key] = deepMerge(merged[key], value);
                    } else {
                        merged[key] = value;
                    }
                });
                return merged;
            }

            function getCurrentUser() {
                return JSON.parse(localStorage.getItem('solarflow_crm_current_user') || sessionStorage.getItem('solarflow_crm_current_user') || 'null');
            }

            renderSettingsLayout();
            const currentUser = getCurrentUser();
            if (currentUser?.name) {
                const settingsUserName = document.getElementById('settingsUserName');
                const settingsUserRole = document.getElementById('settingsUserRole');
                if (settingsUserName) settingsUserName.textContent = currentUser.name;
                if (settingsUserRole) settingsUserRole.textContent = currentUser.role || 'Admin/Owner';
            }
            renderMain();
            loadSettingsData();
        } else {
            ensureAccess();
            if (window.crmApi?.token()) {
                crmApi.getStaff().then(({ staff }) => {
                    saveStaffList(staff);
                    renderStaffTable();
                }).catch((error) => alert(error.message));
                loadAccessRequests();
            }
        }
    </script>
</body>

</html>
