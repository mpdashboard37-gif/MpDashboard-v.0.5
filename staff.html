<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Management - MP DASHBOARD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="crm-api.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400;FILL@0;GRAD@0;opsz@24&display=swap"
        rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <button id="backToDashboardBtn"
                    class="inline-flex items-center gap-2 px-3 py-2 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-sm font-medium text-slate-700">
                    <span class="material-symbols-outlined text-base">arrow_back</span>
                    Back
                </button>
                <div>
                    <p class="text-sm uppercase tracking-wide text-slate-500">Owner/Admin</p>
                    <h1 class="text-3xl font-bold text-slate-900">Staff Management</h1>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="text-right">
                    <p id="currentUserName" class="font-semibold text-slate-800">Admin</p>
                    <p id="currentUserRole" class="text-sm text-slate-500">Admin/Owner</p>
                </div>
                <button id="logoutBtn"
                    class="px-3 py-2 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-sm font-medium">Logout</button>
            </div>
        </div>

        <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
            <div class="flex items-center justify-between border-b border-slate-200 p-4">
                <h2 class="text-xl font-semibold text-slate-800">Employees <span id="pendingCount"
                        class="text-sm font-medium text-amber-600"></span></h2>
                <button id="openAddStaffModal"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg">+ Add
                    Staff</button>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200">
                    <thead class="bg-slate-50">
                        <tr>
                            <th
                                class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                                Name</th>
                            <th
                                class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                                Employee ID</th>
                            <th
                                class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                                Department</th>
                            <th
                                class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                                Designation</th>
                            <th
                                class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                                Login ID</th>
                            <th
                                class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                                Status</th>
                            <th
                                class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                                Failed Attempts</th>
                            <th
                                class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                                Deactivated At</th>
                            <th
                                class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-600">
                                Actions</th>
                        </tr>
                    </thead>
                    <tbody id="staffTableBody" class="divide-y divide-slate-200 bg-white"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="staffModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between p-4 border-b border-slate-200">
                <h3 id="staffModalTitle" class="text-xl font-semibold text-slate-800">Add Staff</h3>
                <button id="closeStaffModal" class="text-slate-500 hover:text-slate-700">✕</button>
            </div>

            <form id="staffForm" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Employee Name</label>
                    <input id="name" aria-label="Employee Name" type="text"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none"
                        required />
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Employee ID</label>
                    <input id="employeeId" aria-label="Employee ID" type="text"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none"
                        required />
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Department</label>
                    <select id="department" aria-label="Department"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none"
                        required>
                        <option value="Sales">Sales</option>
                        <option value="Telecalling">Telecalling</option>
                        <option value="Installation">Installation</option>
                        <option value="Administration">Administration</option>
                        <option value="Operations">Operations</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Designation</label>
                    <select id="designation" aria-label="Designation"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none"
                        required>
                        <option value="Sales Executive">Sales Executive</option>
                        <option value="Telecaller">Telecaller</option>
                        <option value="Installation Team">Installation Team</option>
                        <option value="Admin/Owner">Admin/Owner</option>
                        <option value="Manager">Manager</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Login ID</label>
                    <input id="loginId" aria-label="Login ID" type="text"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none"
                        required />
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Status</label>
                    <select id="status" aria-label="Status"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none"
                        required>
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input id="password" aria-label="Password" type="password"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none"
                        required />
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Confirm Password</label>
                    <input id="confirmPassword" aria-label="Confirm Password" type="password"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none"
                        required />
                </div>

                <input id="editingId" type="hidden" />

                <div class="md:col-span-2 flex justify-end gap-3 pt-2">
                    <button type="button" id="cancelStaffBtn"
                        class="px-4 py-2.5 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-50">Cancel</button>
                    <button type="submit"
                        class="px-4 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium">Create
                        Staff</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const CURRENT_USER_KEY = 'solarflow_crm_current_user';
        let staffCache = [];

        function getCurrentUser() {
            return JSON.parse(localStorage.getItem(CURRENT_USER_KEY) || 'null');
        }

        function ensureAccess() {
            const currentUser = getCurrentUser() || JSON.parse(sessionStorage.getItem(CURRENT_USER_KEY) || 'null');
            if (!currentUser || currentUser.role !== 'Admin/Owner' || !window.crmApi?.token()) {
                window.location.href = 'login.html';
            }
            document.getElementById('currentUserName').textContent = currentUser?.name || 'Admin';
            document.getElementById('currentUserRole').textContent = currentUser?.role || 'Admin/Owner';
        }

        function getStaffList() {
            return staffCache;
        }

        function saveStaffList(staff) {
            staffCache = staff.map(({ password, ...employee }) => employee);
        }

        function renderStaffTable() {
            const staff = getStaffList();
            const tbody = document.getElementById('staffTableBody');
            tbody.innerHTML = '';
            const pendingCount = staff.filter((employee) => employee.accountStatus === 'PENDING').length;
            document.getElementById('pendingCount').textContent = pendingCount ? `(${pendingCount} pending)` : '';

            staff.forEach((employee) => {
                const protectedAdmin = employee.id === 'staff-admin' || String(employee.loginId || '').toLowerCase() === 'admin';
                const row = document.createElement('tr');
                row.className = 'hover:bg-slate-50';
                row.innerHTML = `
          <td class="px-4 py-3 font-medium text-slate-800">${employee.name}</td>
          <td class="px-4 py-3 text-slate-600">${employee.employeeId}</td>
          <td class="px-4 py-3 text-slate-600">${employee.department}</td>
          <td class="px-4 py-3 text-slate-600">${employee.designation}</td>
          <td class="px-4 py-3 text-slate-600">${employee.loginId}</td>
                    <td class="px-4 py-3">
                        <span class="px-2 py-1 rounded-full text-xs font-semibold ${employee.accountStatus === 'ACTIVE' || employee.status === 'Active' ? 'bg-green-100 text-green-700' : employee.accountStatus === 'PENDING' ? 'bg-amber-100 text-amber-700' : 'bg-red-100 text-red-700'}">${employee.accountStatus === 'DEACTIVATED' ? 'Deactivated' : employee.accountStatus === 'DECLINED' ? 'Declined' : employee.accountStatus === 'PENDING' ? 'Pending Approval' : employee.status}</span>
          </td>
                    <td class="px-4 py-3 text-slate-600">${Number(employee.failedLoginAttempts || 0)}/5</td>
                    <td class="px-4 py-3 text-slate-600">${employee.deactivatedAt ? new Date(employee.deactivatedAt).toLocaleString() : '-'}</td>
          <td class="px-4 py-3">
            <div class="flex flex-wrap gap-2 text-sm">
              <button class="view-btn px-2 py-1 rounded border border-slate-200 hover:bg-slate-100" data-id="${employee.id}">View</button>
              ${protectedAdmin ? '<span class="px-2 py-1 text-slate-500">Protected Admin</span>' : `<button class="edit-btn px-2 py-1 rounded border border-slate-200 hover:bg-slate-100" data-id="${employee.id}">Edit</button>
              <button class="reset-btn px-2 py-1 rounded border border-slate-200 hover:bg-slate-100" data-id="${employee.id}">Reset Password</button>
              <button class="toggle-btn px-2 py-1 rounded border border-slate-200 hover:bg-slate-100" data-id="${employee.id}">${employee.accountStatus === 'PENDING' ? 'Approve / Decline' : employee.accountStatus === 'DEACTIVATED' || employee.accountStatus === 'DECLINED' || employee.status !== 'Active' ? 'Reactivate Account' : 'Deactivate Account'}</button>
              <button class="delete-btn px-2 py-1 rounded border border-red-200 text-red-600 hover:bg-red-50" data-id="${employee.id}">Delete</button>`}
            </div>
          </td>
        `;
                tbody.appendChild(row);
            });

            document.querySelectorAll('.view-btn').forEach((button) => {
                button.addEventListener('click', () => {
                    const employee = staff.find((item) => item.id === button.dataset.id);
                    if (!employee) return;
                    alert(`Employee Name: ${employee.name}\nEmployee ID: ${employee.employeeId}\nDepartment: ${employee.department}\nDesignation: ${employee.designation}\nLogin ID: ${employee.loginId}\nStatus: ${employee.status}`);
                });
            });

            document.querySelectorAll('.edit-btn').forEach((button) => {
                button.addEventListener('click', () => {
                    const employee = staff.find((item) => item.id === button.dataset.id);
                    if (!employee) return;
                    openStaffModal(employee);
                });
            });

            document.querySelectorAll('.reset-btn').forEach((button) => {
                button.addEventListener('click', () => {
                    const employee = staff.find((item) => item.id === button.dataset.id);
                    if (!employee) return;
                    const newPassword = prompt(`Reset password for ${employee.name}. Enter new password:`, '');
                    if (newPassword === null || newPassword.trim() === '') return;
                    crmApi.updateStaff(employee.id, { password: newPassword.trim() }).then(() => crmApi.getStaff()).then(({ staff: fresh }) => { saveStaffList(fresh); renderStaffTable(); alert('Password reset successfully.'); }).catch((error) => alert(error.message));
                });
            });

            document.querySelectorAll('.toggle-btn').forEach((button) => {
                button.addEventListener('click', () => {
                    const employee = staff.find((item) => item.id === button.dataset.id);
                    if (!employee) return;
                    const isPending = employee.accountStatus === 'PENDING';
                    const isDeactivated = employee.accountStatus === 'DEACTIVATED' || employee.accountStatus === 'DECLINED' || employee.status !== 'Active';
                    const action = isPending ? prompt(`Type APPROVE or DECLINE for ${employee.name}'s account:`)?.trim().toUpperCase() : isDeactivated ? 'REACTIVATE' : 'DEACTIVATE';
                    if (!action || !['APPROVE', 'DECLINE', 'REACTIVATE', 'DEACTIVATE'].includes(action)) return alert('No account action was performed.');
                    if (!isPending && !confirm(`Are you sure you want to ${action.toLowerCase()} ${employee.name}'s account?`)) return;
                    const accountStatus = action === 'APPROVE' || action === 'REACTIVATE' ? 'ACTIVE' : action === 'DECLINE' ? 'DECLINED' : 'DEACTIVATED';
                    crmApi.updateStaff(employee.id, { accountStatus, reason: action === 'DECLINE' ? 'Declined by administrator' : action === 'DEACTIVATE' ? 'Deactivated by administrator' : undefined }).then(() => crmApi.getStaff()).then(({ staff: fresh }) => { saveStaffList(fresh); renderStaffTable(); }).catch((error) => alert(error.message));
                });
            });

            document.querySelectorAll('.delete-btn').forEach((button) => {
                button.addEventListener('click', () => {
                    const employee = staff.find((item) => item.id === button.dataset.id);
                    if (!employee) return;
                    if (confirm(`Delete ${employee.name}?`)) crmApi.deleteStaff(employee.id).then(() => crmApi.getStaff()).then(({ staff: fresh }) => { saveStaffList(fresh); renderStaffTable(); }).catch((error) => alert(error.message));
                });
            });
        }

        const modal = document.getElementById('staffModal');
        const form = document.getElementById('staffForm');
        const modalTitle = document.getElementById('staffModalTitle');

        function openStaffModal(employee = null) {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            form.reset();
            document.getElementById('editingId').value = employee ? employee.id : '';
            document.getElementById('staffModalTitle').textContent = employee ? 'Edit Staff' : 'Add Staff';
            document.querySelector('#staffForm button[type="submit"]').textContent = employee ? 'Update Staff' : 'Create Staff';

            if (employee) {
                document.getElementById('name').value = employee.name;
                document.getElementById('employeeId').value = employee.employeeId;
                document.getElementById('department').value = employee.department;
                document.getElementById('designation').value = employee.designation;
                document.getElementById('loginId').value = employee.loginId;
                document.getElementById('status').value = employee.status;
                document.getElementById('password').value = '';
                document.getElementById('confirmPassword').value = '';
                document.getElementById('password').required = false;
                document.getElementById('confirmPassword').required = false;
            } else {
                document.getElementById('password').required = true;
                document.getElementById('confirmPassword').required = true;
            }
        }

        function closeStaffModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            form.reset();
        }

        document.getElementById('openAddStaffModal').addEventListener('click', () => openStaffModal());
        document.getElementById('closeStaffModal').addEventListener('click', closeStaffModal);
        document.getElementById('cancelStaffBtn').addEventListener('click', closeStaffModal);

        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            const editingId = document.getElementById('editingId').value;
            const payload = {
                name: document.getElementById('name').value.trim(),
                employeeId: document.getElementById('employeeId').value.trim(),
                department: document.getElementById('department').value,
                designation: document.getElementById('designation').value,
                loginId: document.getElementById('loginId').value.trim(),
                status: document.getElementById('status').value,
                role: document.getElementById('designation').value === 'Admin/Owner' ? 'Admin/Owner' : (document.getElementById('designation').value === 'Sales Executive' ? 'Sales Executive' : (document.getElementById('designation').value === 'Telecaller' ? 'Telecaller' : (document.getElementById('designation').value === 'Installation Team' ? 'Installation Team' : 'Employee'))),
            };

            if (!payload.name || !payload.employeeId || !payload.loginId) {
                alert('Please fill all required fields.');
                return;
            }

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (!editingId && (!password || !confirmPassword)) {
                alert('Password and confirm password are required for a new employee.');
                return;
            }
            if (password && password !== confirmPassword) {
                alert('Passwords do not match.');
                return;
            }

            try {
                if (editingId) await crmApi.updateStaff(editingId, { ...payload, ...(password ? { password } : {}) });
                else await crmApi.createStaff({ ...payload, password });
                closeStaffModal();
                const fresh = await crmApi.getStaff();
                saveStaffList(fresh.staff);
                renderStaffTable();
            } catch (error) {
                alert(error.message);
            }
        });

        document.getElementById('backToDashboardBtn').addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try { await crmApi.request('/api/auth/logout', { method: 'POST' }); } catch (error) { console.error(error); }
            localStorage.removeItem(CURRENT_USER_KEY);
            sessionStorage.removeItem(CURRENT_USER_KEY);
            localStorage.removeItem('solarflow_crm_api_token');
            sessionStorage.removeItem('solarflow_crm_api_token');
            window.location.href = 'login.html';
        });

        ensureAccess();
        if (window.crmApi?.token()) {
            crmApi.getStaff().then(({ staff }) => {
                saveStaffList(staff);
                renderStaffTable();
            }).catch((error) => alert(error.message));
        }
    </script>
</body>

</html>
